<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Goal Tracker — split add button</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <nav id="navbar">
    <div class="nav-left">
      <span class="logo">GoalTracker</span>
    </div>
    <div class="nav-right">
      <button id="logoutBtn">🚪 Wyloguj</button>
    </div>
  </nav>

  <main>
    <h1>🎯 Goal Tracker</h1>

    <!-- Split add button: left = add simpleGoal, right = dropdown -->
    <div class="toolbar">
      <div class="add-split" id="addSplit">
        <button id="addSimpleGoalBtn" class="add-main" aria-label="Dodaj simpleGoal">
          ➕ Dodaj simpleGoal
        </button>
        <button id="toggleAddMenuBtn" class="add-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="addGoalMenu" title="Więcej typów">
          ▾
        </button>

        <div class="add-dropdown-menu" id="addGoalMenu" role="menu" aria-hidden="true">
          <button class="menu-item" data-type="simple" role="menuitem">➕ simpleGoal</button>
          <button class="menu-item" data-type="progress" role="menuitem">📊 progressGoal</button>
          <button class="menu-item" data-type="habit" role="menuitem">🔁 habitGoal (placeholder)</button>
        </div>
      </div>
    </div>

    <div class="grid" id="simpleGoalGrid" aria-live="polite"></div>
  </main>

  <!-- SimpleGoal Modal -->
  <div id="simpleGoalModalBg" class="simple-goal-modal-bg" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="simple-goal-modal" role="document" aria-labelledby="simpleGoalModalTitle">
      <h2 id="simpleGoalModalTitle">Dodaj simpleGoal</h2>

      <label for="simpleGoalTitle">Tytuł</label>
      <input type="text" id="simpleGoalTitle" name="simpleGoalTitle" autocomplete="off" />

      <label for="simpleGoalDesc">Opis</label>
      <textarea id="simpleGoalDesc" name="simpleGoalDesc" rows="4"></textarea>

      <label for="simpleGoalCategory">Kategoria</label>
      <select id="simpleGoalCategory" name="simpleGoalCategory">
        <option value="">(brak)</option>
        <option value="__new">➕ Dodaj nową kategorię</option>
      </select>

      <input type="text" id="newSimpleCategoryInput" class="hidden" placeholder="Nowa kategoria..." />

      <div class="simple-modal-actions">
        <button id="saveSimpleGoalBtn" class="primary">Zapisz</button>
      </div>
    </div>
  </div>

  <!-- ProgressGoal Modal -->
  <div id="progressGoalModalBg" class="simple-goal-modal-bg" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="simple-goal-modal" role="document" aria-labelledby="progressGoalModalTitle">
      <h2 id="progressGoalModalTitle">Dodaj progressGoal</h2>

      <label for="progressGoalTitle">Tytuł</label>
      <input type="text" id="progressGoalTitle" name="progressGoalTitle" autocomplete="off" />

      <label for="progressGoalDesc">Opis</label>
      <textarea id="progressGoalDesc" name="progressGoalDesc" rows="3"></textarea>

      <label for="progressGoalCategory">Kategoria</label>
      <select id="progressGoalCategory" name="progressGoalCategory">
        <option value="">(brak)</option>
        <option value="__new">➕ Dodaj nową kategorię</option>
      </select>

      <input type="text" id="newProgressCategoryInput" class="hidden" placeholder="Nowa kategoria..." />

      <label for="progressGoalRange">Postęp: <span id="progressGoalValue">0%</span></label>
      <input type="range" id="progressGoalRange" min="0" max="100" value="0" />

      <div class="simple-modal-actions">
        <button id="saveProgressGoalBtn" class="primary">Zapisz progressGoal</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
